name: Secret scan

# gitleaks on every PR (diff) + weekly full-history scan.

on:
  pull_request: {}
  schedule:
    - cron: '0 5 * * 6'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
