name: CI

# Every push to master / PR: core unit tests with the 95 % coverage gate, lint, debug and
# release APKs, the Espresso suite with its coverage gate on an emulator. On v* tags: a GitHub
# release with the APKs attached.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests + coverage gate, lint, APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core unit tests with the 95 % line-coverage gate
        run: ./gradlew :core:check --no-daemon
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Debug APK + instrumented test APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Release APK (signed with the release key when the secret exists, otherwise debug-signed)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/release.keystore; fi
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release*.apk triggertrap-${GITHUB_REF_NAME//\//-}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: triggertrap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: triggertrap-release-apk
          path: triggertrap-*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-coverage-and-lint-reports
          path: |
            core/build/reports
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  ui-test:
    name: Android UI end-to-end + coverage gate (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Espresso tests with coverage, then the gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          # the action runs every script line in its own shell: one script keeps the
          # diagnostics after Gradle (screenshots, focus, logcat) in the artifact
          script: sh .github/scripts/emulator-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-and-coverage-reports
          path: |
            app/build/reports/androidTests/connected
            app/build/reports/jacoco
            app/build/emulator-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: GitHub release (tags)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, ui-test]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: triggertrap-*
          merge-multiple: true
      - name: Name the artifacts after the tag
        run: |
          ls -la
          mv app-debug.apk triggertrap-${GITHUB_REF_NAME}-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            triggertrap-*.apk
          body: |
            Install the release APK on Android 8.0 or newer. It needs a Triggertrap Mobile dongle
            (or a compatible audio-jack trigger) and the camera cable; see the README.
